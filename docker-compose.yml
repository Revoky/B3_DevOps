services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadminTP2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    ports:
      - "8081:80"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apiTP2
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env

volumes:
  mysql_data: {}