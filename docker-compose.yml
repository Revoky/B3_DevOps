version: '3.8'

services:
  mysql:
    image: mysql
    container_name: mysqlTP1_2
    environment:
      MYSQL_ROOT_PASSWORD: monmotdepasse
      MYSQL_DATABASE: dbTP1_2
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadminTP1_2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysqlTP1_2
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  db_data: